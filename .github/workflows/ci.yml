name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run on the same branch: waiting for a build that
# can no longer matter is the slowest part of iterating on CI itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    timeout-minutes: 10
    # The identity gate runs first: a forbidden token must never reach an artifact,
    # so nothing else is allowed to build before this passes.
    name: identity gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gate self-test
        run: bash scripts/debrand_selftest.sh
      - name: scan the tree
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: python scripts/debrand.py --src

  rust:
    name: rust
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The GUI crate embeds the front-end bundle when it compiles, so a clean
      # checkout must build it before cargo runs.
      - name: front end
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev pkg-config
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --lib --tests

  windows-x64:
    name: Windows x64 build, tests and package smoke
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: npm ci --prefix ui
      - run: npm --prefix ui run build
      - run: cargo test --workspace --lib --tests
      - name: Bundle
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle-windows.ps1 -Target x86_64-pc-windows-msvc
      - run: cargo test --workspace --lib --tests
      - name: Portable CLI smoke
        shell: pwsh
        run: |
          Expand-Archive artifacts/windows/x86_64-pc-windows-msvc/*-portable.zip "$env:RUNNER_TEMP/portable"
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-tools
          path: vendor/windows/x86_64-pc-windows-msvc/tools
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 build, tests and package smoke
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-tools
          path: helper-payload
      - run: npm ci --prefix ui
      - run: npm --prefix ui run build
      - run: cargo test --workspace --lib --tests
      - name: Bundle using x64 helpers
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle-windows.ps1 -Target aarch64-pc-windows-msvc -HelperPayload "$pwd/helper-payload"
      - run: cargo test --workspace --lib --tests
      - name: Portable CLI smoke
        shell: pwsh
        run: |
          Expand-Archive artifacts/windows/aarch64-pc-windows-msvc/*-portable.zip "$env:RUNNER_TEMP/portable"
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ui:
    name: ui
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run test:geometry
      - run: npm --prefix ui run test:format
      - run: npm --prefix ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/convertme-gui/ui-dist

  package:
    name: package (linux)
    needs: [rust, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The release profile is what this job builds; keeping it separate from the
          # debug cache the Rust job fills avoids evicting either.
          prefix-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/convertme-gui/ui-dist
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev pkg-config imagemagick ffmpeg pandoc 7zip ghostscript \
            poppler-utils qpdf tesseract-ocr rpm
      - name: cache locked Linux tool archives
        uses: actions/cache@v4
        with:
          path: vendor/cache/linux
          key: linux-tools-${{ hashFiles('packaging/linux/tools.lock.json') }}
      - name: capture locked Linux tool archives
        run: python3 scripts/vendor-linux.py --capture-tools
      - name: bundle
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle.sh deb
      - name: scan the artifacts
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: python scripts/debrand.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/convertme
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tools
          path: vendor/linux/x86_64-unknown-linux-gnu/tools

  perf:
    # The budgets are requirements, so a regression fails the build.
    name: perf budgets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/convertme-gui/ui-dist
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev pkg-config xvfb imagemagick ffmpeg pandoc 7zip \
            ghostscript poppler-utils qpdf tesseract-ocr
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: target/release
      - run: chmod +x target/release/convertme
      - uses: actions/download-artifact@v4
        with:
          name: linux-tools
          path: vendor/linux/x86_64-unknown-linux-gnu/tools
      - name: prepare packaged probe resources
        run: |
          mkdir -p target/release/tools
          cp -a vendor/linux/x86_64-unknown-linux-gnu/tools/. target/release/tools/
      # The budget the product promises (600 ms) is measured on a desktop session.
      # This container has no GPU and starts WebKit in seconds, so the gate here
      # catches regressions against the container baseline instead of pretending.
      # Each start sample is a fresh process, and this container needs seconds to
      # eight launches tell a regression from noise just as well.
      - name: cold start
        run: xvfb-run -a cargo xtask perf start --runs 8 --budget 8000
      - name: wheel
        run: xvfb-run -a cargo xtask perf wheel --runs 30 --budget 400
      - name: idle cost
        run: xvfb-run -a cargo xtask perf idle --seconds 20
