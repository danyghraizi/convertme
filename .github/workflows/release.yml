name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: python scripts/debrand.py --src

  linux:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev libssl-dev pkg-config binutils dpkg-dev imagemagick ffmpeg pandoc ghostscript libgs-common fonts-urw-base35 poppler-utils poppler-data qpdf tesseract-ocr tesseract-ocr-eng 7zip rpm
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: python3 scripts/vendor-linux.py --capture-tools
      - env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle.sh deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm

  windows-x64:
    needs: gate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo test --workspace --lib --tests
      - env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle-windows.ps1 -Target x86_64-pc-windows-msvc
      - run: cargo test --workspace --lib --tests
      - name: Smoke portable CLI
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/windows/x86_64-pc-windows-msvc' -Filter 'ConvertMe-*-windows-x64-portable.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one x64 portable ZIP, found $($archives.Count)" }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "$env:RUNNER_TEMP/portable"
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke portable GUI image conversion (partial desktop coverage)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -File scripts/app-e2e-windows.ps1 -Binary "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" -Fixtures "$env:GITHUB_WORKSPACE/fixtures" -Out "$env:RUNNER_TEMP/gui-smoke" -Only convert-image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: artifacts/windows/x86_64-pc-windows-msvc
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-x64-tools
          path: vendor/windows/x86_64-pc-windows-msvc/tools
          if-no-files-found: error

  windows-arm64:
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: release-x64-tools
          path: helper-payload
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo test --workspace --lib --tests
      - env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: ./scripts/bundle-windows.ps1 -Target aarch64-pc-windows-msvc -HelperPayload "$pwd/helper-payload"
      - run: cargo test --workspace --lib --tests
      - name: Smoke portable CLI
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/windows/aarch64-pc-windows-msvc' -Filter 'ConvertMe-*-windows-arm64-portable.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one ARM64 portable ZIP, found $($archives.Count)" }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "$env:RUNNER_TEMP/portable"
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke portable GUI image conversion (partial desktop coverage)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -File scripts/app-e2e-windows.ps1 -Binary "$env:RUNNER_TEMP/portable/ConvertMe/convertme.exe" -Fixtures "$env:GITHUB_WORKSPACE/fixtures" -Out "$env:RUNNER_TEMP/gui-smoke" -Only convert-image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-arm64
          path: artifacts/windows/aarch64-pc-windows-msvc
          if-no-files-found: error
