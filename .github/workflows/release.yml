name: Release

on:
  push:
    tags: ["v*"]

# The job publishes its bundles to the release for the pushed tag.
permissions:
  contents: write

jobs:
  gate:
    name: identity gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: python scripts/debrand.py --src

  build:
    needs: gate
    strategy:
      fail-fast: false
      # Windows bundles are produced on a Windows host with the tools vendored for
      # that target; `cargo xtask vendor` copies from the system it runs on, so it
      # cannot fetch them here yet. CI still compiles and checks the Windows build.
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev pkg-config imagemagick ffmpeg pandoc ghostscript \
            poppler-utils qpdf tesseract-ocr 7zip rpm

      - name: vendor the bundled tools
        run: cargo xtask vendor

      - name: build the PDF sidecar
        shell: bash
        run: ./sidecars/pdf/build.sh

      - name: copy the sidecar next to the other bundled tools
        shell: bash
        run: cp sidecars/pdf/dist/convertme-pdf* "vendor/bin/convertme-pdf-$(rustc --print host-tuple)$( [[ ${{ runner.os }} == Windows ]] && echo .exe )"

      - name: build and bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `beforeBuildCommand` runs the identity gate before the front end.
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: |
          npm --prefix ui ci
          ./scripts/bundle.sh ${{ matrix.bundles }}

      - name: scan the artifacts
        env:
          DEBRAND_TOKENS: ${{ secrets.DEBRAND_TOKENS }}
        run: python scripts/debrand.py --all

      # A tag push alone creates no GitHub release, and the bundles used to sit in
      # the Actions tab only. Smoke-test what will be downloaded, then attach it.
      - name: smoke-test the packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          someone=0
          for deb in target/release/bundle/deb/*.deb; do
            [ -e "$deb" ] || continue
            someone=1
            dpkg-deb -f "$deb" Version | grep -Fx "$version"
            rm -rf /tmp/deb-smoke && dpkg-deb -x "$deb" /tmp/deb-smoke
            /tmp/deb-smoke/usr/bin/convertme --version | grep -F "$version"
          done
          for image in target/release/bundle/appimage/*.AppImage; do
            [ -e "$image" ] || continue
            someone=1
            rm -rf /tmp/appimage-smoke && mkdir -p /tmp/appimage-smoke
            (cd /tmp/appimage-smoke && "$OLDPWD/$image" --appimage-extract >/dev/null)
            /tmp/appimage-smoke/squashfs-root/AppRun --version | grep -F "$version"
          done
          [ "$someone" = 1 ] || { echo "no package was produced" >&2; exit 1; }

      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "ConvertMe ${tag#v}" --generate-notes
          mapfile -t files < <(find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \
               -o -name 'latest.json' \) | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "no bundles to publish" >&2; exit 1; }
          gh release upload "$tag" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.zip
            target/release/bundle/**/*.sig
            target/release/bundle/**/latest.json
