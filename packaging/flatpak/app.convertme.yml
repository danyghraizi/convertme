# Flatpak manifest.
#
# The bundled tools live inside the sandbox; LibreOffice is reachable only through
# `flatpak-spawn --host soffice`, which the probe already handles, so Office → PDF
# rows disappear when the host has no LibreOffice. ODT output uses the bundled
# Pandoc, so it does not need the host.
app-id: app.convertme
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: convertme
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: convertme
    buildsystem: simple
    build-commands:
      - install -Dm755 convertme /app/bin/convertme
      - mkdir -p /app/lib/app.convertme/tools
      - cp -a tools/. /app/lib/app.convertme/tools/
      - install -Dm644 app.convertme.desktop /app/share/applications/app.convertme.desktop
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/convertme.png
      - install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/convertme.png
      - install -Dm644 NOTICE /app/share/doc/convertme/NOTICE
      - install -Dm644 LICENSE /app/share/doc/convertme/LICENSE
    sources:
      - type: file
        path: ../../target/release/convertme
      - type: dir
        path: ../../vendor/linux/x86_64-unknown-linux-gnu/tools
        dest: tools
      - type: dir
        path: ../../crates/convertme-gui/icons
      - type: file
        path: ../../packaging/app.convertme.desktop
      - type: file
        path: ../../NOTICE
      - type: file
        path: ../../LICENSE
