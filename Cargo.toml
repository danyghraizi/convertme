[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://convertme.app"

[workspace.dependencies]
convertme-core = { path = "crates/convertme-core" }
convertme-engines = { path = "crates/convertme-engines" }
convertme-drag = { path = "crates/convertme-drag" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rusqlite = { version = "0.41.0", features = ["bundled"] }
libc = "0.2.191"
uuid = { version = "1.29.0", features = ["v4"] }
sha2 = "0.11.1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
oxipng = { version = "10.2.1", default-features = false }
png = "0.18.1"
# The libimagequant algorithm behind pngquant. Single-threaded keeps the artifact
# deterministic and avoids pulling in rayon's thread-local pool.
imagequant = { version = "4.4.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
walkdir = "2.5.0"
parking_lot = "0.13.0"
crossbeam-channel = "0.5.17"
smallvec = "1"
windows = "0.62.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
panic = "abort"

[profile.dev]
# Keep the dev profile linkable with the Tauri dev server while staying fast.
opt-level = 1
